name: Build and typecheck frontend

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, typecheck, build
        run: |
          set -o pipefail
          # Works around a known npm arborist bug ("Cannot read properties of
          # null (reading 'edgesOut')") seen with the npm version bundled in
          # setup-node@v4's node 20 -- there's no package-lock.json committed
          # (only bun.lock, which npm doesn't read), so npm has to resolve
          # the whole dependency graph fresh, and older npm trips on that.
          npm install -g npm@11
          { npm install --no-audit --no-fund \
            && npm run lint \
            && npm run build; } 2>&1 | tee build.log

      - name: Report build log to an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=$(tail -c 60000 build.log)
          BODY=$(printf '### Frontend build failed on `%s`\nRun: %s\n\n```\n%s\n```\n' \
            "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$LOG")
          echo "$BODY" > /tmp/issue_body.md
          NUM=$(gh issue list --repo "${{ github.repository }}" --search "frontend CI build log in:title" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file /tmp/issue_body.md
          else
            gh issue create --repo "${{ github.repository }}" --title "frontend CI build log" --body-file /tmp/issue_body.md
          fi
